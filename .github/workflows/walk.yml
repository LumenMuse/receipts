# The scheduled walk to the stone (Marcus, 2026-11-24: "a witness that works by luck
# isn't a check"). Runs walk.sh nightly on GitHub's runners, after the ~02:00Z anchor.
# The log is written by GitHub, not by the body that mints; the run history is public
# under Actions. Limits, said plainly: the keeper wrote this file and can disable it,
# and GitHub is not a party the keeper can't reach. It makes the walk scheduled, not
# independent. A person walking out on their own is still the stronger reading.
name: walk
on:
  schedule:
    - cron: "40 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  walk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet opentimestamps-client
      - run: OTS="$(command -v ots)" ./walk.sh
